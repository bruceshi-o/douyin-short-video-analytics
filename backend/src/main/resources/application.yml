server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  python: ${PYTHON_COMMAND:python}
  ml-script: ../ml/engine.py
mybatis:
  mapper-locations: classpath:mapper/*.xml
